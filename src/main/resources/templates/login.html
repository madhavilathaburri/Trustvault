<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrustVault Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-bg"><main class="auth-card"><div class="brand">TV</div><h2 class="text-center">Welcome back</h2><p class="text-center text-muted">Sign in to your secure workspace</p><div class="alert alert-success" th:if="${param.registered}">Account created. Sign in now.</div><div class="alert alert-danger" th:if="${param.error}">Invalid email or password.</div><form th:action="@{/login}" method="post"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="username" required><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-primary w-100">Sign in</button></form><p class="text-center mt-3">New user? <a th:href="@{/register}">Create account</a></p></main></body></html>
