<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-bg"><main class="auth-card"><div class="brand">TV</div><h2 class="text-center">Create account</h2><p class="text-center text-muted">New accounts start as Employees</p><form th:action="@{/register}" th:object="${form}" method="post"><label>Full name</label><input class="form-control mb-2" th:field="*{fullName}" required><small class="text-danger" th:errors="*{fullName}"></small><label>Email</label><input class="form-control mb-2" type="email" th:field="*{email}" required><small class="text-danger" th:errors="*{email}"></small><label>Password (8+ characters)</label><input class="form-control mb-2" type="password" th:field="*{password}" required minlength="8"><small class="text-danger" th:errors="*{password}"></small><label>Confirm password</label><input class="form-control mb-2" type="password" th:field="*{confirmPassword}" required><small class="text-danger" th:errors="*{confirmPassword}"></small><button class="btn btn-primary w-100 mt-3">Register</button></form><p class="text-center mt-3">Already registered? <a th:href="@{/login}">Sign in</a></p></main></body></html>
