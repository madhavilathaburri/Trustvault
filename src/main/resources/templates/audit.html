<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Trail</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav class="navbar navbar-dark nav px-4"><a class="navbar-brand" th:href="@{/dashboard}">TrustVault</a></nav><main class="container py-5"><h1>Audit trail</h1><p class="text-muted">Latest 200 events. Admin-only page.</p><div class="card p-3 table-responsive"><table class="table table-hover"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Document</th><th>Result</th><th>Details</th></tr></thead><tbody><tr th:each="l:${logs}"><td th:text="${#temporals.format(l.eventTime,'dd MMM yyyy HH:mm:ss')}"></td><td th:text="${l.actorEmail}"></td><td th:text="${l.action}"></td><td th:text="${l.documentName}"></td><td th:text="${l.outcome}"></td><td th:text="${l.details}"></td></tr></tbody></table></div><a class="btn btn-link mt-3" th:href="@{/dashboard}">← Dashboard</a></main></body></html>
