<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav class="navbar navbar-dark nav px-4"><a class="navbar-brand" th:href="@{/dashboard}">TrustVault</a><form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm">Logout</button></form></nav><main class="container py-5"><p class="text-primary fw-bold">SECURE DOCUMENT WORKSPACE</p><h1>Hello, <span th:text="${currentUser.fullName}"></span></h1><p class="text-muted">Your role: <b th:text="${currentUser.role}"></b></p><div class="row g-3 mt-3"><div class="col-md-6"><a class="tile" th:href="@{/documents}"><h3>My documents</h3><p>Upload and access documents you own or have been granted access to.</p>Open documents →</a></div><div class="col-md-6" th:if="${currentUser.role.name() == 'ADMIN'}"><a class="tile" th:href="@{/audit}"><h3>Audit trail</h3><p>Review recorded document access decisions.</p>View audit logs →</a></div></div></main></body></html>
